[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "guanheng-wt-runtime"
version = "0.1.0a11+read15.dualcta.1.opening.1"
description = "Independent WonderTrader runtime and QMT process ownership"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["guanheng-market-client==0.21.0"]

[project.optional-dependencies]
execution = ["guanheng-strategy-v1==0.1.0a13", "guanheng-strategy-native==0.1.0a2+read1"]

[project.scripts]
guanheng-wt = "guanheng_wt_runtime.__main__:main"

[tool.flit.module]
name = "guanheng_wt_runtime"

[tool.uv.sources]
guanheng-market-client = { path = "../../../integrations" }
guanheng-strategy-core = { path = "../strategy_core" }
guanheng-strategy-v1 = { path = "../strategy_v1" }
guanheng-strategy-native = { path = "../strategy_native" }
