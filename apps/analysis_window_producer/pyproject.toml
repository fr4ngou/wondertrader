[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "guanheng-analysis-window-producer"
version = "0.1.0a16+market.30.accountexpiry.1.cleanupdiag.1"
description = "WT-owned continuous QNA analysis window producer"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["guanheng-native-analysis-core==0.1.0a4+market.21", "guanheng-wt-runtime==0.1.0a35+recovery.1.accountexpiry.1.cleanupdiag.1", "guanheng-strategy-v1==0.1.0a13"]

[project.optional-dependencies]
bound = ["guanheng-qmt-shm-host>=0.1.0a11,<0.2"]
retained = ["guanheng-qmt-shm-host>=0.1.0a14,<0.2"]

[project.scripts]
guanheng-analysis-window = "guanheng_analysis_window_producer.runtime:main"

[tool.flit.module]
name = "guanheng_analysis_window_producer"
