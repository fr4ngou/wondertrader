[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "guanheng-market-client"
version = "0.15.0"
description = "Standard-library clients for independently managed Guanheng market and native history reader interfaces"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
storage = ["minio==7.2.20", "urllib3==2.7.0"]

[tool.flit.module]
name = "guanheng_market_client"
